name: Metrics
on:
  # Cập nhật tự động hàng ngày
  schedule: [{cron: "0 0 * * *"}]
  # Cho phép chạy thủ công
  workflow_dispatch:
  # Chạy khi có push lên nhánh master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
